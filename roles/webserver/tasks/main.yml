---
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ webserver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create ContentSphere application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy ContentSphere webpage
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ app_directory }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Validate and reload Nginx

- name: Configure ContentSphere Nginx site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/contentsphere
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

- name: Enable ContentSphere Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/contentsphere
    dest: /etc/nginx/sites-enabled/contentsphere
    state: link
  notify: Validate and reload Nginx

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload Nginx

- name: Ensure Nginx is running and enabled
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
